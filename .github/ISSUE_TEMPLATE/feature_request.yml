name: Feature request
description: Propose a focused improvement to Flowmark
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe user-visible behavior, not only an implementation.
    validations:
      required: true
  - type: textarea
    id: format
    attributes:
      label: Workspace-format impact
      description: Does this change authoritative files, schemas, or compatibility?
  - type: checkboxes
    id: principles
    attributes:
      label: Local-first check
      options:
        - label: The proposal keeps Markdown and YAML as the only source of truth.
          required: true
        - label: The proposal works without a network service.
          required: true
