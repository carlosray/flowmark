schema_version: 1
id: rule_reopen_undated
name: Reopened undated cards return to To Plan
enabled: true
trigger: { type: due_state_changed }
conditions:
  - { type: completed, value: false }
  - { type: due_state, value: none }
  - { type: column, operator: in, column_ids: [column_done] }
actions:
  - { type: move_card, column_id: column_to_plan }
