schema_version: 1
id: rule_clear_to_plan
name: Cleared dates return routed cards to To Plan
enabled: true
trigger: { type: due_state_changed }
conditions:
  - { type: completed, value: false }
  - { type: due_state, value: none }
  - type: column
    operator: in
    column_ids: [column_today, column_tomorrow, column_planned]
actions:
  - { type: move_card, column_id: column_to_plan }
created_at: 2026-07-20T10:00:00Z
updated_at: 2026-07-20T10:00:00Z
